name: Lint

on:
  push:
    branches: [ main, experimental ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.eslintrc*'
      - 'eslint.config.mjs'
      - '.prettierrc*'
      - 'package.json'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main, experimental ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.eslintrc*'
      - 'eslint.config.mjs'
      - '.prettierrc*'
      - 'package.json'
      - '.github/workflows/lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Install & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        name: Setup pnpm
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint with auto-fix
        run: pnpm lint
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "has_changes=true" >> $GITHUB_OUTPUT
      - name: Commit and push fixes
        if: steps.git-check.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix linting issues"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: "src/** tests/** docs/** *.md"
      - name: Run lint check (verify)
        run: pnpm lint
