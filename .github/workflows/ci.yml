name: CI

on:
  push:
    branches: [ main, experimental ]
  pull_request:
    branches: [ main, experimental ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # Skip if commit is from github-actions bot (auto-fix commits)
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
            workflows:
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '**.md'

  lint:
    name: Lint
    needs: changes
    if: |
      always() &&
      needs.changes.result != 'failure' &&
      needs.changes.result != 'cancelled' &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run lint with auto-fix
        run: pnpm lint
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "has_changes=true" >> $GITHUB_OUTPUT
      - name: Commit and push fixes
        if: steps.git-check.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix linting issues [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: "src/** tests/** docs/** *.md"
      - name: Run lint check (verify)
        run: pnpm lint

  build:
    name: Build
    needs: changes
    if: |
      always() &&
      needs.changes.result != 'failure' &&
      needs.changes.result != 'cancelled' &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 1

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: [changes, build]
    if: |
      always() &&
      needs.changes.result != 'failure' &&
      needs.changes.result != 'cancelled' &&
      needs.build.result == 'success' &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          flags: node-${{ matrix.node-version }}

  security:
    name: Security Audit
    needs: changes
    if: |
      always() &&
      needs.changes.result != 'failure' &&
      needs.changes.result != 'cancelled' &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high || true

  status-check:
    name: Status Check
    if: always()
    needs: [changes, lint, build, test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check job results
        run: |
          echo "Changes: ${{ needs.changes.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          
          # Fail if any required job failed (skipped is ok)
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          
          # Check if all jobs were skipped (no code changes)
          if [[ "${{ needs.changes.result }}" == "skipped" ]] && \
             [[ "${{ needs.lint.result }}" == "skipped" ]] && \
             [[ "${{ needs.build.result }}" == "skipped" ]] && \
             [[ "${{ needs.test.result }}" == "skipped" ]]; then
            echo "All jobs skipped - no code changes or bot commit"
            exit 0
          fi
          
          echo "All required jobs passed or were skipped"
          exit 0
